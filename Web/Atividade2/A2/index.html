<!DOCTYPE html>
<html>  
<head>
    <meta name="viewport" content="width">
    <title>Formulário de matrícula</title>
    <meta name="description" content="Inscrição para matrícula do IFPE">
</head>
<body>
    <main> 
        <form action="/inscricao" method="post">
            
            <fieldset> 
                <legend>Dados Pessoais </legend>

                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome"  required autocomplete="name">
                <br><br>
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required autocomplete="email">
                <br><br>  
                <label for="date" >Data de Nascimento:</label>
                <input type="date" id="date" name="date"><br>
                <br><br>
                <label for="number">CPF:</label>
                <input type="number" id="number" name="number" required autocomplete="cpf">

            </fieldset>
            <fieldset> 
                <legend> Dados Gerais </legend>

                <input type="radio" id="manha" name="turno" value="manha" >
                <label for="manha">Manhã</label>
                <br><br>
                <input type="radio" id="noite" name="turno" value="noite">
                <label for="noite">Noite</label>
                <br><br>
                <label for="disciplina">Disciplina:</label>
                <select name="discplina" id="disciplina" required>
                    <option value="">Selecione...</option>
                    <option value="web">Web</option>
                    <option value="bd1">Bando de Dados 1</option>
                    <option value="ed2">Estrutura de Dados 2</option>
                </select>
                <label for="mensagem">Mensagem:</label>
                <textarea name="mensagem" id="mensagem" rows="6" placeholder="Digite sua mensagem"></textarea>

            </fieldset>

        </form>
    </main>

</body>
</html>
