<!DOCTYPE html>
<html>  
<head>
    <meta name="viewport" content="width">
    <title>Formulário de matrícula</title>
    <meta name="description" content="Inscrição para matrícula do IFPE">
</head>
<body>
    <main> 
        <form action="/inscricao" method="post">
            
            <fieldset> 
                <legend>Dados Pessoais </legend>

                <label for="name">Nome Completo:</label>
                <input type="text" id="name" name="name" required autocomplete="name" placeholder="Digite seu nome completo">
                <br><br>
                <label for="nomemae">Nome da mãe:</label>
                <input type="text" id="nomemae" name="nomemae"  required autocomplete="nomamae" placeholder="Nome completo da mãe">
                <br><br>
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required autocomplete="email" placeholder="email@example.com">
                <br><br>  
                <label for="date" >Data de Nascimento:</label>
                <input type="date" id="data" name="data">
                <br><br>
                <label for="number">CPF:</label>
                <input type="number" id="cpf" name="cpf" pattern="[0-9]" maxlength="11" autocomplete="cpf" placeholder="Digite apenas numeros" required>
                <br><br>
                <label for="Telefone">Telefone: </label>
                <input type="tel" id="telefone" name="telefone" pattern="[0-9]" required autocomplete="telefone" placeholder="Digite seu telefone">
                <br><br>
                <label for="login">Login: </label>
                <input type="text" id="login" name="login" required>
                <br><br>
                <label for="senha">Senha: </label>
                <input type="password" id="senha" name="senha" required>
            </fieldset>
            <fieldset> 
                <legend> Dados Gerais </legend>

                <label for="disciplina">Curso desejado:</label>
                <select name="discplina" id="disciplina" required>
                    <option value="">Selecione...</option>
                    <option value="web">Curso Técnico: Redes de Computadores</option>
                    <option value="bd1">Curso Técnico: Manutenção e Suporte em informática</option>
                    <option value="ed2">Ensino Superior: Análise e Desenvolvimento de Sistemas</option>
                </select>
                <br><br>
                <legend>Turno</legend>

                <input type="radio" id="manha" name="turno" value="manha" >
                <label for="manha">Manhã</label>
                <input type="radio" id="tarde" name="turno" value="tarde" >
                <label for="tarde">Tarde</label>
                <input type="radio" id="noite" name="turno" value="noite">
                <label for="noite">Noite</label>
                <br><br>
                <label for="arquivo">Enviar Histórico Escolar</label><br>
                <input type="file" id="arquivo" name="arquivo" required>

            </fieldset>
            <br>
            <button type="submit">Enviar</button>
        </form>
    </main>

</body>
</html>
